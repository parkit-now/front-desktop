name: Build desktop app (mac/win/linux)

# Los binarios de los microservicios Python (lpr-service, camera-service) se
# empaquetan con PyInstaller, que NO cross-compila: un .exe de Windows solo
# se puede generar corriendo en un runner Windows (idem mac/linux). Por eso
# este workflow usa una matriz con un runner nativo por SO, en vez de tratar
# de generar los 3 instaladores desde una sola máquina.
#
# No firma los binarios (no hay certificados configurados todavía). Los
# artifacts generados son válidos para pruebas internas del equipo; antes de
# distribuir a clientes hace falta agregar code signing (ver notas al final
# del job `build`).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # GNU make no viene preinstalado en los runners de Windows.
      - name: Install make (Windows)
        if: matrix.target == 'win'
        run: choco install make --no-progress -y

      - name: Install AppImage build deps (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: bun install

      - name: Build Python services (native binaries for this OS)
        run: make services-build

      - name: Build + package Electron app
        run: bun run dist:${{ matrix.target }}
        env:
          # electron-builder intenta publicar/firmar si detecta config de
          # publish; la desactivamos hasta tener certificados.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: parkit-desktop-${{ matrix.target }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.AppImage
          if-no-files-found: error
          retention-days: 14

# Próximos pasos para distribución real a clientes (no bloqueantes para esta
# branch, pero es el camino estándar de la industria):
#   - Windows: certificado Authenticode (evita el warning de SmartScreen que
#     ve el personal de estacionamiento al instalar).
#   - macOS: Apple Developer ID + notarización (Gatekeeper bloquea apps sin
#     notarizar incluso fuera de la App Store).
#   - electron-updater + feed de updates (S3/GitHub Releases) para poder
#     actualizar la flota de kioscos sin visita técnica a cada estacionamiento.
