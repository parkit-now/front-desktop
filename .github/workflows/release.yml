name: Release

# Calcula la próxima versión a partir de Conventional Commits y, si hay algo
# que liberar, crea el tag + GitHub Release (sin assets todavía). Ese tag
# `v*.*.*` es justo el trigger de `build-desktop.yml`, que compila los 3
# instaladores en runners nativos por SO y los adjunta a este mismo Release
# (ver el paso final de ese workflow) — así evitamos duplicar la matriz de
# build acá.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Calcular la próxima versión sin crear tag/release/commit'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install
      - uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
