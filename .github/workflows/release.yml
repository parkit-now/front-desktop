name: Release

# Calcula la próxima versión a partir de Conventional Commits y, si hay algo
# que liberar, crea el tag + GitHub Release, compila los 3 instaladores y los
# adjunta — todo en la misma corrida.
#
# El build NO vive en un workflow separado disparado por el tag: cuando
# GITHUB_TOKEN crea un tag/push, GitHub deliberadamente NO dispara otros
# workflows con ese evento (para evitar loops infinitos), así que un trigger
# `push: tags: v*.*.*` en otro archivo nunca se activaría acá. Por eso el job
# `build` está encadenado con `needs: release` dentro de esta misma corrida.
#
# `build-desktop.yml` sigue existiendo aparte, solo para pruebas manuales
# (`workflow_dispatch`) — no es parte del camino automático.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Calcular la próxima versión sin crear tag/release/commit'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # semantic-release/github intenta comentar en los PRs/issues asociados
      # a cada commit del changelog ("success" step) — sin esto falla con
      # "Resource not accessible by integration" DESPUÉS de crear el release
      # (el release igual queda creado; esto solo evita el error cosmético).
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install make (Windows)
        if: matrix.target == 'win'
        run: choco install make --no-progress -y

      - name: Install AppImage build deps (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: bun install

      - name: Write .env de producción
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          VITE_API_URL=${VITE_API_URL}
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          EOF

      - name: Build Python services (native binaries for this OS)
        run: make services-build

      - name: Build + package Electron app
        run: bun run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Adjuntar instalador al GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.new_release_git_tag }}
          files: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.AppImage
